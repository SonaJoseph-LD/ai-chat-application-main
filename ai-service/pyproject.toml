[tool]
name = "ai-chat-rag-starter"
version = "0.1.0"
description = "A full-stack AI chat application with context memory (RAG)"
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
fastapi = "^0.75.0"
uvicorn = "^0.17.0"
pydantic = "^1.9.0"
qdrant-client = "^1.7.0"
sentence-transformers = "^2.2.0"
openai = "^0.27.0"
langchain = "^0.1.0"
langchain-openai = "^0.0.5"
langchain-community = "^0.0.13"
langchain-huggingface = "^0.0.1"
langchain-qdrant = "^0.1.0"
pypdf = "^4.0.0"
pandas = "^2.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"